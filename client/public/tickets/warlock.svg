<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-label="Warlock Awards Banquet">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#6fd3e5"/>
      <stop offset="50%" stop-color="#33acc9"/>
      <stop offset="100%" stop-color="#176f90"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="58%" stop-color="#0a4054" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a4054" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
    </pattern>
    <filter id="textsh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b3a4a" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="320" fill="url(#bg)"/>
  <rect width="800" height="320" fill="url(#stripes)"/>
  <rect width="800" height="320" fill="url(#vig)"/>
  <g filter="url(#textsh)" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="168" font-size="70" font-weight="800" letter-spacing="1">WARLOCK AWARDS</text>
    <text x="400" y="216" font-size="28" font-weight="700" letter-spacing="6">FRIDAY NIGHT ONLY</text>
  </g>
</svg>
